# Internship tracker — Dokploy / Traefik deployment.
#
# Three long-running services plus a backup sidecar:
#   postgres  the database; never published, reachable only on `private`
#   app       the Next.js server; the ONLY service Traefik routes
#   worker    node-cron ingestion/alerts; internal network only, no labels
#   backup    periodic pg_dump into the `backups` volume
#
# Every value below comes from the environment — see .env.example. Nothing in
# this file is a secret, and no secret should ever be written into it.

name: internship-tracker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Deliberately no `ports:` — the database is reachable only from `private`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Postgres' own timezone, kept separate from ALERT_TIMEZONE, which is
      # what the application uses for date arithmetic.
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U/-d so this checks the application database specifically, not just
      # "is a postmaster listening" — the two differ during first-boot initdb,
      # which is exactly when app and worker would otherwise start too early.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # initdb on an empty volume takes a while; without this the container is
      # marked unhealthy before it has ever had a chance to come up.
      start_period: 60s
    networks:
      - private

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

      # --- auth (see .env.example; implemented alongside this deployment) ---
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_AUTHENTIK_ISSUER: ${AUTH_AUTHENTIK_ISSUER:?AUTH_AUTHENTIK_ISSUER is required}
      AUTH_AUTHENTIK_ID: ${AUTH_AUTHENTIK_ID:?AUTH_AUTHENTIK_ID is required}
      AUTH_AUTHENTIK_SECRET: ${AUTH_AUTHENTIK_SECRET:?AUTH_AUTHENTIK_SECRET is required}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:?ALLOWED_EMAIL is required}

      # --- scoring ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MAX_CALLS_PER_RUN: ${LLM_MAX_CALLS_PER_RUN:-200}
      LLM_MAX_CANDIDATES_PER_RUN: ${LLM_MAX_CANDIDATES_PER_RUN:-2000}
      RESCORE_MAX_AGE_HOURS: ${RESCORE_MAX_AGE_HOURS:-20}

      # --- alerts (the /alerts page can trigger a real send) ---
      ALERT_TIMEZONE: ${ALERT_TIMEZONE:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      # Bind-mounted as a DIRECTORY, not as a single file. A single-file bind
      # mount pins an inode, so an editor that writes-and-renames (vim, VS Code,
      # most of them) leaves the container reading the old contents forever.
      # Mounting the directory means an edit to config/scoring.json is picked up
      # by the next scoring run with no restart and no redeploy — the whole
      # reason the file is re-read and re-hashed on every run.
      - ./config:/app/config:ro
    healthcheck:
      # No curl or wget in node:*-slim, and node has had global fetch since 18.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      # Covers `prisma migrate deploy` plus the Next server's cold start. A
      # first deploy against an empty database has the whole migration history
      # to apply, so this is generous on purpose.
      start_period: 120s
    networks:
      - private
      - traefik
    labels:
      - "traefik.enable=true"
      # Which of this container's networks Traefik should dial. Without it,
      # Traefik may pick `private`, which it is not attached to.
      - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"

      # HTTPS router — the only thing exposed to the internet.
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}.service=${TRAEFIK_ROUTER:-internship-tracker}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-internship-tracker}.loadbalancer.server.port=3000"

      # Plain HTTP exists only to bounce to HTTPS (and to answer the ACME
      # challenge, which Traefik handles on the entrypoint itself).
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}-web.entrypoints=${TRAEFIK_WEB_ENTRYPOINT:-web}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-internship-tracker}-web.middlewares=${TRAEFIK_ROUTER:-internship-tracker}-redirect"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-internship-tracker}-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-internship-tracker}-redirect.redirectscheme.permanent=true"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      # The app runs `prisma migrate deploy` before it reports healthy, so
      # waiting on the app is what keeps the worker from running a cycle
      # against an unmigrated schema. It is an ordering dependency, not a
      # runtime one: the worker keeps running if the app later goes down.
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # node-cron reads schedules in the container's local time, so TZ is what
      # "0 6 * * *" means.
      TZ: ${TZ:-UTC}
      DATABASE_URL: ${DATABASE_URL}

      # --- schedules ---
      INGEST_CRON: ${INGEST_CRON:-0 6 * * *}
      DIGEST_CRON: ${DIGEST_CRON:-0 7 * * *}
      CLOSING_SOON_CRON: ${CLOSING_SOON_CRON:-0 8 * * *}
      WORKER_PORT: ${WORKER_PORT:-8081}

      # --- ingestion ---
      USER_AGENT_CONTACT: ${USER_AGENT_CONTACT:-}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      DETAIL_REFETCH_DAYS: ${DETAIL_REFETCH_DAYS:-14}
      DETAIL_MAX_PER_RUN: ${DETAIL_MAX_PER_RUN:-250}

      # --- scoring ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MAX_CALLS_PER_RUN: ${LLM_MAX_CALLS_PER_RUN:-200}
      LLM_MAX_CANDIDATES_PER_RUN: ${LLM_MAX_CANDIDATES_PER_RUN:-2000}
      RESCORE_MAX_AGE_HOURS: ${RESCORE_MAX_AGE_HOURS:-20}

      # --- alerts ---
      ALERT_TIMEZONE: ${ALERT_TIMEZONE:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      # No AUTH_* here on purpose: the worker serves no user traffic, so it has
      # no reason to hold the OIDC client secret.
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.WORKER_PORT||8081)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # `private` only, and no `ports:` and no Traefik labels anywhere in this
    # service. POST /refresh must be reachable from the app container
    # (http://worker:8081/refresh) and from nowhere else. Adding this service to
    # the traefik network, or publishing WORKER_PORT, would expose an
    # unauthenticated endpoint that starts a full ingestion cycle.
    networks:
      - private

  backup:
    # Same image as the server: pg_dump refuses to dump from a server newer than
    # itself, so pinning both to one tag means an upgrade can never silently
    # break backups.
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # libpq's own variables: pg_dump and pg_restore read these directly, so no
      # password is ever passed as an argument where `ps` could show it.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
      - ./scripts:/scripts:ro
    # A sleep loop rather than crond: busybox crond wants to be root so it can
    # switch users per crontab, and the dumps have no reason to run as root.
    # The first dump happens at deploy time — which is when you most want one —
    # and every BACKUP_INTERVAL_SECONDS after that.
    #
    # NOTE for manual runs: this entrypoint is `sh -c`, which swallows arguments.
    # To run the restore script, override it:
    #   docker compose run --rm --entrypoint sh backup /scripts/restore.sh --list
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Docker creates a fresh named volume root-owned, and /backups does not
        # exist in the image for it to copy ownership from, so `postgres` could
        # not write there. Start as root only long enough to hand the directory
        # over, then drop to `postgres` for every dump that follows.
        set -e
        mkdir -p "$$BACKUP_DIR"
        chown postgres:postgres "$$BACKUP_DIR"
        echo "[backup] scheduler started; interval $${BACKUP_INTERVAL_SECONDS}s"
        exec su postgres -c '
          while true; do
            sh /scripts/backup.sh || echo "[backup] run failed; will retry next interval"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
          done
        '
    healthcheck:
      # "Backups quietly stopped weeks ago" is the classic way to discover you
      # have none. This goes unhealthy once no dump has been written in two
      # whole intervals, which is the only symptom a wedged loop produces.
      # Nothing depends on this service, so an unhealthy result is a signal,
      # never a cascade.
      test:
        [
          "CMD-SHELL",
          "find \"$$BACKUP_DIR\" -name '*.dump' -mmin -$$(( ($$BACKUP_INTERVAL_SECONDS * 2) / 60 )) | grep -q .",
        ]
      interval: 1h
      timeout: 30s
      retries: 2
      # Long enough for the first dump of a large catalog to finish.
      start_period: 10m
    networks:
      - private

volumes:
  pgdata:
  backups:

networks:
  # Service-to-service traffic. Not marked `internal: true`: the worker has to
  # reach job boards, the Anthropic API, Discord and SMTP.
  private:
    driver: bridge
  # Dokploy's shared Traefik network. Created by Dokploy, hence external — only
  # `app` joins it, which is what keeps everything else unroutable.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
